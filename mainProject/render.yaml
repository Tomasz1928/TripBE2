# render.yaml — Infrastructure-as-Code for Render
# Put this in the root of your repo.
# Render will auto-detect it and offer to create all services.

databases:
  - name: tripapp-db
    plan: free          # free tier: 256 MB, auto-expires after 90 days
    databaseName: tripapp
    user: tripapp_user
    # ipAllowList: []   # uncomment to restrict access

services:
  - type: web
    name: tripapp
    runtime: python
    plan: free          # free tier: spins down after 15 min inactivity

    # Build
    buildCommand: "./build.sh"

    # Start — Daphne for ASGI (HTTP + WebSocket)
    startCommand: "cd mainProject && daphne -b 0.0.0.0 -p $PORT mainProject.asgi:application"

    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"

      - key: DJANGO_SETTINGS_MODULE
        value: mainProject.settings_production

      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a random secret

      - key: ALLOWED_HOSTS
        # Render sets RENDER_EXTERNAL_HOSTNAME automatically
        # but we need it in ALLOWED_HOSTS too
        value: ".onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: tripapp-db
          property: connectionString

      - key: SECURE_SSL_REDIRECT
        value: "True"